@startuml starwars-2021

skinparam componentStyle rectangle

component kitt [
Kitt Rocko
Nautolan Slicer
Ship Engineer
Fun Loving Hacker
Homeworld: Glee Anselm
]

component rowan [
Rowan Cloudcaster
Human Pilot
Wild Card
Homeworld: Bovoyogan
]

component hess [
Hess Ruutizz
Kel Dor Padawan
Order of the Dragon
Ship Gunner
Mystical Muscle
Homeworld: New Alderaan
]

component tarei [
Tarei Vosek
Munn Banking Clan Aristocrat
Ship Commander
Homeworld: Scipio
]

component master [
Master Satechi
Human Jedi
Stoic Master
Homeworld: New Alderaan
]


component carnet [
Carnet Kaserin
Human pilot
deceased
]


carnet <- - rowan : former boss
rowan <-> kitt : coworkers
master -> hess : Master
master <- hess : Padawan
rowan -> tarei : Reluctant Subordinate
tarei -> rowan : Overseer

@enduml

